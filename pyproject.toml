[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmi-gateway"
version = "0.1.0"
description = "C.M.I. Gateway: read-only FastAPI gateway in front of the TA CMI heating control (schematic + JSON-API + changer resolver)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "Anganthier" }]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "duckdb>=2.0",
    "pyarrow>=15",
    # L2-Engine im Gateway (S4N-UI-KI): analysis.model.l2 + L1 v003 (LightGBM)
    # laufen IN-IMAGE; numpy ist die Array-Basis von L1/L2 (lightgbm zieht
    # scipy/narwhals automatisch nach).
    "lightgbm>=4.6",
    "numpy>=1.26",
    # M1 calendar_utils (NRW-Feiertage via python-holidays) wird im Feature-Build
    # gebraucht: im Gateway in-image (L2) und im cmi-m1-merge-Service auf dem Pi.
    # duckdb/pyarrow sind bereits oben; holidays fehlt im Slim-Image sonst.
    "holidays>=0.59",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "bandit[toml]>=1.7",
]

[project.scripts]
cmi-gateway = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
markers = [
    "slow: langsame Tests (Produktiv-Daten/Full-Rebuilds); Standard-Run mit -m 'not slow'",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
